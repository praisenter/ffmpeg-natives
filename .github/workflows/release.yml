name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed release tag, for example v8.1-1'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    env:
      CENTRAL_USERNAME: ${{ secrets.nexus_username }}
      CENTRAL_PASSWORD: ${{ secrets.nexus_password }}
      GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Read version from the checked-out release POM
        shell: pwsh
        run: |
          [xml] $pom = Get-Content pom.xml
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_VERSION=$($pom.project.version)"
      - name: Check release tag matches non-snapshot version
        run: |
          if ($env:RELEASE_TAG -ne "v$env:ARTIFACT_VERSION") { throw 'Release tag must match the POM version' }
          ./.github/scripts/package.ps1
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.gpg_private_key }}
          gpg-passphrase-env-var: GPG_PASSPHRASE
      - uses: actions/download-artifact@v7
        with:
          name: ffmpeg-distributions
          path: target/distributions
      - name: Validate exact tested archives, sign and upload for Central validation
        run: |
          foreach ($classifier in @('windows-x86_64', 'linux-x86_64', 'macos-x86_64', 'macos-aarch64')) {
            ./.github/scripts/test.ps1 -Classifier $classifier -ArchiveOnly
          }
          mvn -B -ntp -Prelease deploy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }